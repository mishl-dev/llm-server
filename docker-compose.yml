services:
  llama-router:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama.cpp-router
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/models
      - ./models.toml:/models.toml
      - ./docker-entrypoint.sh:/entrypoint.sh
      - ./logs:/var/log/llama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    entrypoint:
      - "/entrypoint.sh"
